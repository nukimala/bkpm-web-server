<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Pengguna - SI Akademik (Acara 25 RBAC)</title>
  <!-- Bootstrap 5 CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card-login {
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      overflow: hidden;
      max-width: 440px;
      width: 100%;
    }
    .card-header-custom {
      background-color: #ffffff;
      padding: 30px 24px 10px;
      text-align: center;
      border-bottom: none;
    }
    .btn-login {
      background: #0d6efd;
      border: none;
      padding: 12px;
      font-weight: 600;
      border-radius: 8px;
    }
    .demo-box {
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #0d6efd;
    }
  </style>
</head>
<body>

  <div class="card card-login bg-white p-4">
    <div class="card-header-custom">
      <div class="bg-primary text-white rounded-circle d-inline-flex p-3 mb-3 shadow-sm">
        <i class="bi bi-shield-lock-fill fs-2"></i>
      </div>
      <h3 class="fw-bold text-dark">Portal SI-Akademik</h3>
      <p class="text-muted small">Autentikasi & Otorisasi RBAC (Acara 25)</p>
    </div>

    <div class="card-body pt-2">
      <!-- Alert Pesan Error -->
      <div id="alert-error" class="alert alert-danger d-none" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span id="alert-msg"></span>
      </div>

      <form id="form-login">
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" id="username" class="form-control" placeholder="Masukkan username" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-key"></i></span>
            <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
          </div>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary btn-login w-100 shadow-sm mb-3">
          <span id="btn-text"><i class="bi bi-box-arrow-in-right me-2"></i>Masuk ke Dashboard</span>
          <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
      </form>

      <!-- Informasi Akun Uji Coba RBAC -->
      <div class="demo-box p-3 small">
        <div class="fw-bold text-dark mb-1"><i class="bi bi-info-circle me-1"></i>Akun Uji Coba RBAC:</div>
        <div class="d-flex justify-content-between mb-1">
          <span><strong>Admin:</strong> admin / admin123</span>
          <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2" onclick="setDemo('admin', 'admin123')">Pilih</button>
        </div>
        <div class="d-flex justify-content-between">
          <span><strong>User:</strong> user / user123</span>
          <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="setDemo('user', 'user123')">Pilih</button>
        </div>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
