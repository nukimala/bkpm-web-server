<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Pegawai - SI Kepegawaian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .form-card { max-width: 700px; margin: 30px auto; border-radius: 12px; border: none; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        .preview-avatar { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 3px solid #dee2e6; }
    </style>
</head>
<body>

<div class="container mb-5">
    <div class="card form-card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
            <h4 class="fw-bold mb-0">Edit Data Pegawai</h4>
            <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">⬅️ Kembali</a>
        </div>

        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="editForm">
            <!-- Preview Foto -->
            <div class="text-center mb-3">
                <img id="imgPreview" src="../uploads/default.png" class="preview-avatar mb-2" alt="Foto Profil">
                <div>
                    <label for="foto" class="btn btn-sm btn-outline-primary fw-semibold">Ganti Foto Profil</label>
                    <input type="file" id="foto" name="foto" class="d-none" accept="image/jpeg,image/png,image/webp">
                </div>
                <small class="text-muted d-block mt-1">Biarkan kosong jika tidak ingin mengganti foto</small>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">NIP <span class="text-danger">*</span></label>
                    <input type="text" id="nip" name="nip" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Nama Lengkap <span class="text-danger">*</span></label>
                    <input type="text" id="nama" name="nama" class="form-control" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Jabatan <span class="text-danger">*</span></label>
                    <input type="text" id="jabatan" name="jabatan" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Nomor HP</label>
                <input type="text" id="no_hp" name="no_hp" class="form-control">
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Alamat</label>
                <textarea id="alamat" name="alamat" class="form-control" rows="2"></textarea>
            </div>

            <button type="submit" id="btnUpdate" class="btn btn-primary w-100 py-2 fw-semibold">
                🔄 Perbarui Data Pegawai
            </button>
        </form>
    </div>
</div>

<script src="form_edit.js"></script>
</body>
</html>
