<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SI Kepegawaian</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card-login {
            max-width: 400px;
            width: 100%;
            padding: 24px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border: none;
        }
        .brand-logo {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="card card-login">
        <div class="brand-logo">🏛️</div>
        <h4 class="text-center fw-bold mb-1">SI-Kepegawaian</h4>
        <p class="text-center text-muted mb-4 small">Silakan masuk untuk melanjutkan</p>
        <div id="alertBox" class="alert d-none" role="alert"></div>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <input type="text" class="form-control" id="username" placeholder="admin_hr atau pegawai1" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit" id="btnLogin" class="btn btn-primary w-100 py-2 fw-semibold">Masuk ke Sistem</button>
        </form>
        <div class="mt-4 pt-3 border-top text-center text-muted small">
            <p class="mb-1"><strong>Akun Percobaan:</strong></p>
            <span>Admin HR: <code>admin_hr</code> / <code>admin123</code></span><br>
            <span>Pegawai: <code>pegawai1</code> / <code>pegawai123</code></span>
        </div>
    </div>
<script src="login.js?v=2"></script>
</body>
</html>
