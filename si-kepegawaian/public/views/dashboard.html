<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard SI-Kepegawaian</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <style>
            body {
                background-color: #f0f2f5;
            }
            .avatar-img {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                object-fit: cover;
                border: 2px solid #dee2e6;
            }
            .table-card {
                border-radius: 8px;
                border : none;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
        </style>    
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
            <div class="container">
                <a class="navbar-brand fw-bold" href="dashboard.html">SI-Kepegawaian</a>
                <div class="d-flex align-items-center text-white">
                    <span id="userInfo" class="me-3 small fw-semibold">Memuat Pengguna....</span>
                    <button id="btnLogout" class="btn btn-outline-light btn-sm">Keluar</button>
                </div>
            </div>
        </nav>
        <div class="container mb-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold">Daftar Pegawai</h4>
                <p class="text-muted small mb-0">kelola informasi seluruh staf dan pejabat</p>
            </div>
            <div id="adminActionsArea">
                <a href="form_tambah.html" class="btn btn-primary fw-semibold shadow-sm">Tambah Pegawai</a>
            </div>
        </div>
        <div class="card table-card p-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Foto</th>
                            <th>NIP</th>
                            <th>Nama</th>
                            <th>Jabatan</th>
                            <th>Email</th>
                            <th>No. HP</th>
                            <th class="text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="pegawaiTableBody">
                        <tr>
                            <td colspan="7" class="text-center text-muted">Memuat data pegawai...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <script src="dashboard.js?v=3"></script>
    </body>
</html>
